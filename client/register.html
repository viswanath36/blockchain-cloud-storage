<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — BlockChain Storage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#020817;color:white;
  padding:40px 16px;
  background-image:
    radial-gradient(ellipse 70% 50% at 80% 0%,rgba(124,58,237,0.14) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 10% 100%,rgba(0,212,255,0.1) 0%,transparent 60%);
}

canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.grid-bg{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;
  background-image:
    linear-gradient(rgba(124,58,237,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,58,237,0.03) 1px,transparent 1px);
  background-size:60px 60px;pointer-events:none;
}

    .card{
      background:#fff;
      padding:35px;
      width:360px;
      border-radius:14px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    h2{ margin-bottom:20px; }

    input{
      width:100%;
      padding:12px;
      margin:10px 0;
      border-radius:8px;
      border:1px solid #ccc;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:linear-gradient(to right,#3b82f6,#2563eb);
      color:white;
      font-size:16px;
      cursor:pointer;
      margin-top:10px;
    }

    button:disabled{
      opacity:0.6;
      cursor:not-allowed;
    }

    .msg{ margin-top:12px; font-weight:bold; }
    .success{ color:green; }
    .error{ color:red; }

    img{
      margin-top:15px;
      border-radius:8px;
    }

    a{ text-decoration:none; color:#2563eb; font-weight:bold; }
  </style>
</head>
<body>

<canvas id="c"></canvas>
<div class="grid-bg"></div>
<a class="back-link" href="index.html">← Home</a>

<div class="card">
  <div class="steps">
    <div class="step active" id="s1"></div>
    <div class="step" id="s2"></div>
    <div class="step" id="s3"></div>
  </div>

  <div class="logo-mark">🛡️</div>
  <div class="card-title">
    <h2>Create Account</h2>
    <p>Set up your encrypted vault in seconds</p>
  </div>

  <form id="registerForm">
    <!-- ✅ ADDED NAME FIELD -->
    <input type="text" id="name" placeholder="Full Name" required>

    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>

    <button id="registerBtn">Register</button>
  </form>

  <p id="msg"></p>

  <div id="qrBox"></div>

  <div class="divider"><span>already have an account?</span></div>
  <div class="card-footer">
    <a href="login.html">Sign in instead → <span>Login</span></a>
  </div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,ps=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
for(let i=0;i<60;i++)ps.push({x:Math.random()*1920,y:Math.random()*1080,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()+.3,a:Math.random()*.4+.05,c:Math.random()>.5?'124,58,237':'0,212,255'});
(function loop(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${p.c},${p.a})`;ctx.fill();});requestAnimationFrame(loop);})();

document.getElementById("registerForm").onsubmit = async (e)=>{
  e.preventDefault();
  const btn=document.getElementById("registerBtn");
  const msgEl=document.getElementById("msg");
  const qrBox=document.getElementById("qrBox");

  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value.trim();

  if(!name||!email||!password){
    msgEl.innerText="All fields are required";
    msgEl.className="error";msgEl.style.display='block';return;
  }

  btn.disabled=true;btn.innerText="Creating account...";
  msgEl.className="loading";msgEl.style.display='block';
  msgEl.innerText="Setting up your vault...";

  const res = await fetch("/api/auth/register",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      name,
      email,
      password
    })
  });

  const data = await res.json();

  btn.disabled = false;
  btn.innerText = "Register";

  if(res.ok){
    msg.innerText = "✅ Registered successfully";
    msg.className = "msg success";

    // ✅ show QR code
    qrBox.innerHTML = `
      <img src="${data.qrCode}" width="200">
      <p>Scan using Google Authenticator</p>
      <button onclick="goLogin()">Continue to Login</button>
    `;
  }else{
    msg.innerText = data.message || "Registration failed";
    msg.className = "msg error";
  }
};

function copyKey(){
  const text = document.getElementById("manualKey").innerText;
  navigator.clipboard.writeText(text);
  alert("Secret key copied!");
}

function copyKey(){
  navigator.clipboard.writeText(document.getElementById("manualKey").innerText);
  alert("Secret key copied to clipboard!");
}
function goLogin(){window.location="login.html";}
</script>
</body>
</html>
