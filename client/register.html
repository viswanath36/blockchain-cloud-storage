<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — BlockChain Storage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#020817;color:white;
  padding:40px 16px;
  background-image:
    radial-gradient(ellipse 70% 50% at 80% 0%,rgba(124,58,237,0.14) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 10% 100%,rgba(0,212,255,0.1) 0%,transparent 60%);
}

canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.grid-bg{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;
  background-image:
    linear-gradient(rgba(124,58,237,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,58,237,0.03) 1px,transparent 1px);
  background-size:60px 60px;pointer-events:none;
}

.card{
  position:relative;z-index:10;width:460px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:24px;padding:44px 40px;
  backdrop-filter:blur(24px);
  box-shadow:0 32px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.04) inset,0 1px 0 rgba(255,255,255,0.1) inset;
  animation:cardIn 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(0.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(124,58,237,0.7),transparent);border-radius:100px;}

.logo-mark{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(0,212,255,0.2));
  border:1px solid rgba(124,58,237,0.35);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;font-size:24px;
}

.card-title{text-align:center;margin-bottom:4px;}
.card-title h2{font-size:24px;font-weight:800;letter-spacing:-0.5px;}
.card-title p{font-size:14px;color:rgba(255,255,255,0.45);margin-top:6px;}

.input-group{margin-top:28px;display:flex;flex-direction:column;gap:14px;}

.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;font-weight:600;color:rgba(255,255,255,0.5);letter-spacing:0.5px;text-transform:uppercase;}
.field input{
  padding:13px 16px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;color:white;font-size:15px;
  transition:all 0.3s;outline:none;
  -webkit-text-fill-color:white;
}
.field input::placeholder{color:rgba(255,255,255,0.25);}
.field input:focus{border-color:rgba(124,58,237,0.55);background:rgba(124,58,237,0.06);box-shadow:0 0 0 3px rgba(124,58,237,0.12);}

.btn-submit{
  width:100%;padding:14px;margin-top:4px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#7c3aed,#00d4ff);
  color:white;font-size:15px;font-weight:700;border-radius:12px;
  box-shadow:0 4px 24px rgba(124,58,237,0.35);
  transition:all 0.3s;position:relative;overflow:hidden;
}
.btn-submit::after{
  content:'';position:absolute;top:-50%;left:-60%;width:200%;height:200%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
  transform:skewX(-20deg);transition:left 0.5s;
}
.btn-submit:hover::after{left:120%;}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(124,58,237,0.5);}
.btn-submit:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

/* MESSAGE */
#msg{
  margin-top:14px;padding:12px;border-radius:10px;
  font-size:13px;font-weight:600;text-align:center;display:none;
}
#msg.success{background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);color:#34d399;}
#msg.error{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#f87171;}
#msg.loading{background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.25);color:#c4b5fd;}

/* QR BOX */
#qrBox{
  margin-top:20px;padding:24px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;text-align:center;
  display:none;
}
#qrBox img{border-radius:12px;border:3px solid rgba(124,58,237,0.3);}
#qrBox p{font-size:13px;color:rgba(255,255,255,0.55);margin:12px 0 6px;}
#qrBox b{color:rgba(255,255,255,0.9);}

.manual-key{
  margin:10px 0;
  background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);
  padding:12px;border-radius:10px;
  font-size:13px;font-family:monospace;
  word-break:break-all;color:#67e8f9;
  letter-spacing:1px;
}

.qr-btns{display:flex;gap:10px;margin-top:12px;justify-content:center;flex-wrap:wrap;}
.qr-btn{
  padding:10px 20px;border:none;border-radius:10px;cursor:pointer;
  font-size:13px;font-weight:600;transition:all 0.2s;
}
.btn-copy{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:#34d399;}
.btn-copy:hover{background:rgba(16,185,129,0.25);}
.btn-continue{background:linear-gradient(135deg,#7c3aed,#00d4ff);color:white;}
.btn-continue:hover{transform:translateY(-1px);}

.divider{display:flex;align-items:center;gap:12px;margin:8px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08);}
.divider span{font-size:12px;color:rgba(255,255,255,0.25);}

.card-footer{margin-top:20px;text-align:center;}
.card-footer a{font-size:14px;color:rgba(255,255,255,0.45);text-decoration:none;transition:color 0.2s;}
.card-footer a span{color:#7c3aed;font-weight:600;}
.card-footer a:hover{color:rgba(255,255,255,0.8);}

.back-link{
  position:fixed;top:28px;left:28px;z-index:100;
  padding:10px 16px;border-radius:10px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.6);font-size:13px;font-weight:500;
  text-decoration:none;backdrop-filter:blur(10px);transition:all 0.2s;
}
.back-link:hover{background:rgba(255,255,255,0.08);color:white;}

/* steps indicator */
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:24px;}
.step{width:28px;height:4px;border-radius:100px;background:rgba(255,255,255,0.1);transition:all 0.4s;}
.step.active{background:linear-gradient(90deg,#7c3aed,#00d4ff);}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="grid-bg"></div>
<a class="back-link" href="index.html">← Home</a>

<div class="card">
  <div class="steps">
    <div class="step active" id="s1"></div>
    <div class="step" id="s2"></div>
    <div class="step" id="s3"></div>
  </div>

  <div class="logo-mark">🛡️</div>
  <div class="card-title">
    <h2>Create Account</h2>
    <p>Set up your encrypted vault in seconds</p>
  </div>

  <form id="registerForm">
    <div class="input-group">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required>
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" required>
      </div>
      <button class="btn-submit" id="registerBtn" type="submit">Create Secure Account</button>
    </div>
  </form>

  <p id="msg"></p>

  <div id="qrBox"></div>

  <div class="divider"><span>already have an account?</span></div>
  <div class="card-footer">
    <a href="login.html">Sign in instead → <span>Login</span></a>
  </div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,ps=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
for(let i=0;i<60;i++)ps.push({x:Math.random()*1920,y:Math.random()*1080,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()+.3,a:Math.random()*.4+.05,c:Math.random()>.5?'124,58,237':'0,212,255'});
(function loop(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${p.c},${p.a})`;ctx.fill();});requestAnimationFrame(loop);})();

document.getElementById("registerForm").onsubmit = async (e)=>{
  e.preventDefault();
  const btn=document.getElementById("registerBtn");
  const msgEl=document.getElementById("msg");
  const qrBox=document.getElementById("qrBox");

  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value.trim();

  if(!name||!email||!password){
    msgEl.innerText="All fields are required";
    msgEl.className="error";msgEl.style.display='block';return;
  }

  btn.disabled=true;btn.innerText="Creating account...";
  msgEl.className="loading";msgEl.style.display='block';
  msgEl.innerText="Setting up your vault...";

  try{
    const res=await fetch("/api/auth/register",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,email,password})
    });
    const data=await res.json();
    btn.disabled=false;btn.innerText="Create Secure Account";

    if(res.ok){
      msgEl.className="success";msgEl.innerText="✓ Account created successfully!";
      document.getElementById("s2").classList.add("active");
      document.getElementById("s3").classList.add("active");

      qrBox.style.display='block';
      qrBox.innerHTML=`
        <img src="${data.qrCode}" width="180">
        <p><b>Scan with Google Authenticator</b></p>
        <p style="font-size:12px;color:rgba(255,255,255,0.35);">Or enter the key manually:</p>
        <div class="manual-key" id="manualKey">${data.manualKey}</div>
        <div class="qr-btns">
          <button class="qr-btn btn-copy" onclick="copyKey()">📋 Copy Key</button>
          <button class="qr-btn btn-continue" onclick="goLogin()">Continue to Login →</button>
        </div>
      `;
    }else{
      msgEl.className="error";msgEl.innerText=data.message||"Registration failed";
    }
  }catch(err){
    btn.disabled=false;btn.innerText="Create Secure Account";
    msgEl.className="error";msgEl.innerText="Server error. Please try again.";
  }
};

function copyKey(){
  navigator.clipboard.writeText(document.getElementById("manualKey").innerText);
  alert("Secret key copied to clipboard!");
}
function goLogin(){window.location="login.html";}
</script>
</body>
</html>
