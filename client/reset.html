<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Password — BlockChain Storage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#f7f9fc;color:#1a1a1a;overflow:hidden;
  background-image:
    radial-gradient(ellipse 70% 60% at 30% 0%,rgba(245,158,11,0.06) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 90% 100%,rgba(124,58,237,0.06) 0%,transparent 60%);
}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.grid-bg{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;
  background-image:
    linear-gradient(rgba(0,0,0,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,0.03) 1px,transparent 1px);
  background-size:60px 60px;pointer-events:none;
}

.card{
  position:relative;z-index:10;width:420px;
  background:#ffffff;
  border:1px solid #e5e5e5;
  border-radius:24px;padding:44px 40px;
  backdrop-filter:blur(24px);
  box-shadow:0 32px 80px rgba(0,0,0,0.08),0 0 0 1px rgba(0,0,0,0.02) inset,0 1px 0 rgba(0,0,0,0.04) inset;
  animation:cardIn 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(0.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.card::before{
  content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(245,158,11,0.5),transparent);
  border-radius:100px;
}

.logo-mark{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,rgba(245,158,11,0.15),rgba(124,58,237,0.1));
  border:1px solid rgba(245,158,11,0.25);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;font-size:24px;
}
.card-title{text-align:center;margin-bottom:4px;}
.card-title h2{font-size:24px;font-weight:800;letter-spacing:-0.5px;color:#111;}
.card-title p{font-size:14px;color:#666;margin-top:8px;line-height:1.6;}

.input-group{margin-top:28px;display:flex;flex-direction:column;gap:14px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;font-weight:600;color:#666;letter-spacing:0.5px;text-transform:uppercase;}
.field input{
  padding:13px 16px;
  background:#ffffff;border:1px solid #ccc;
  border-radius:12px;color:#111;font-size:15px;transition:all 0.3s;outline:none;
  -webkit-text-fill-color:#111;
}
.field input::placeholder{color:#999;}
.field input:focus{border-color:#f59e0b;background:#fff7ed;box-shadow:0 0 0 3px rgba(245,158,11,0.12);}

/* OTP field special */
#otp{
  font-size:22px;font-weight:700;letter-spacing:12px;text-align:center;
  font-family:monospace;
}

/* password strength bar */
.strength-bar{height:3px;border-radius:100px;background:#e5e5e5;margin-top:6px;overflow:hidden;}
.strength-fill{height:100%;border-radius:100px;width:0;transition:all 0.4s;}

.btn-submit{
  width:100%;padding:14px;margin-top:4px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#f59e0b,#7c3aed);
  color:white;font-size:15px;font-weight:700;border-radius:12px;
  box-shadow:0 4px 24px rgba(245,158,11,0.25);transition:all 0.3s;
  position:relative;overflow:hidden;
}
.btn-submit::after{
  content:'';position:absolute;top:-50%;left:-60%;width:200%;height:200%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
  transform:skewX(-20deg);transition:left 0.5s;
}
.btn-submit:hover::after{left:120%;}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(245,158,11,0.35);}

#msg{
  margin-top:14px;padding:12px;border-radius:10px;
  font-size:13px;font-weight:600;text-align:center;display:none;
}
#msg.success{background:#e6fffa;border:1px solid #99f6e4;color:#059669;}
#msg.error{background:#fee2e2;border:1px solid #fecaca;color:#dc2626;}
#msg.loading{background:#fff7ed;border:1px solid #fed7aa;color:#d97706;}

.card-footer{margin-top:24px;text-align:center;}
.card-footer a{font-size:14px;color:#666;text-decoration:none;transition:color 0.2s;}
.card-footer a span{color:#f59e0b;font-weight:600;}
.card-footer a:hover{color:#000;}

.back-link{
  position:fixed;top:28px;left:28px;z-index:100;
  padding:10px 16px;border-radius:10px;
  background:#ffffff;border:1px solid #e5e5e5;
  color:#555;font-size:13px;font-weight:500;
  text-decoration:none;backdrop-filter:blur(10px);transition:all 0.2s;
}
.back-link:hover{background:#f0f0f0;color:#000;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="grid-bg"></div>
<a class="back-link" href="forgot.html">← Back</a>

<div class="card">
  <div class="logo-mark">🔑</div>
  <div class="card-title">
    <h2>New Password</h2>
    <p>Enter the OTP sent to your email and choose a new secure password.</p>
  </div>

  <div class="input-group">
    <div class="field">
      <label>One-Time Password</label>
      <input type="text" id="otp" placeholder="• • • • • •" maxlength="6">
    </div>
    <div class="field">
      <label>New Password</label>
      <input type="password" id="password" placeholder="Min. 8 characters" oninput="checkStrength(this.value)">
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    </div>
    <button class="btn-submit" onclick="resetPassword()">Reset Password</button>
  </div>

  <div id="msg"></div>

  <div class="card-footer">
    <a href="login.html">Back to <span>Login</span></a>
  </div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,ps=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
for(let i=0;i<60;i++)ps.push({x:Math.random()*1920,y:Math.random()*1080,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()+.3,a:Math.random()*.35+.05,c:Math.random()>.5?'245,158,11':'124,58,237'});
(function loop(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${p.c},${p.a})`;ctx.fill();});requestAnimationFrame(loop);})();

function checkStrength(v){
  const fill=document.getElementById("strengthFill");
  let s=0;
  if(v.length>=8)s++;
  if(/[A-Z]/.test(v))s++;
  if(/[0-9]/.test(v))s++;
  if(/[^A-Za-z0-9]/.test(v))s++;
  const colors=['','#ef4444','#f59e0b','#10b981','#00d4ff'];
  const widths=['0%','25%','50%','75%','100%'];
  fill.style.width=widths[s];fill.style.background=colors[s]||'';
}

async function resetPassword(){
  const otp=document.getElementById("otp").value.trim();
  const password=document.getElementById("password").value.trim();
  const email=localStorage.getItem("resetEmail");
  const msg=document.getElementById("msg");
  if(!otp||!password){msg.className="error";msg.style.display='block';msg.innerText="Enter OTP and new password";return;}
  msg.className="loading";msg.style.display='block';msg.innerText="Resetting your password...";
  try{
    const res=await fetch("/api/auth/reset",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email,otp,password})
    });
    const data=await res.json();
    if(res.ok){
      msg.className="success";msg.innerText="✓ Password reset! Redirecting to login...";
      localStorage.removeItem("resetEmail");
      setTimeout(()=>window.location.href="login.html",1500);
    }else{
      msg.className="error";msg.innerText=data.message||"Reset failed";
    }
  }catch(err){
    msg.className="error";msg.innerText="Server error. Please try again.";
  }
}
</script>
</body>
</html>
